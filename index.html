function navigate(r){route=r;render();window.scrollTo({top:0,behavior:'smooth'})}function pageContent(){switch(route){case'dashboard':return isCreator()?creatorDashboard():brandDashboard();case'my-profile':return myCreatorProfile();case'brand-profile':return myBrandProfile();case'discover-brands':return discoverBrands();case'discover-creators':case'find-creators':return discoverCreators();case'campaigns':return campaignsPage();case'inbox':return inboxPage();case'deals':return dealsPage();default:return isCreator()?creatorDashboard():brandDashboard()}}
function banner(kicker,title,description,buttonText,handler,icon='✦'){return `<section class="banner"><div><div class="eyebrow">${esc(kicker)}</div><h2>${esc(title)}</h2><p>${esc(description)}</p>${buttonText?`<button class="btn" style="margin-top:17px" onclick="${handler}">${esc(buttonText)} →</button>`:''}</div><div class="banner-symbol">${icon}</div></section>`}
function creatorDashboard(){const p=currentProfile(),completion=profileCompletion(),brands=allBrandProfiles().slice(0,2),creators=allCreatorProfiles().filter(c=>c.id!==currentKey()).slice(0,2),connections=allConnections().filter(c=>c.creatorKey===currentKey()||c.brandKey===currentKey());return `${banner('CREATOR SPACE','Make your work easy to discover.','Your profile is your storefront. Keep your portfolio current and find brands whose campaigns fit your style.','Edit my profile',"navigate('my-profile')")}<div class="statgrid"><div class="statcard"><div class="statlabel">Profile completeness</div><div class="statvalue">${completion}%</div><div class="statnote">${completion>=80?'Looking good':'A few more details help brands assess fit'}</div></div><div class="statcard"><div class="statlabel">Active connections</div><div class="statvalue">${connections.length}</div><div class="statnote">Invitations and conversations</div></div><div class="statcard"><div class="statlabel">Starting rate</div><div class="statvalue">${money(p.budget||0)}</div><div class="statnote">Keep pricing expectations clear</div></div></div>${completion<100?`<div class="profilecompletion"><div style="display:flex;justify-content:space-between;gap:12px"><strong>Complete your creator profile</strong><span class="muted small">${completion}% complete</span></div><div class="muted small">A clear bio, portfolio links, skills and experience help brands make a decision.</div><div class="completionbar"><span style="width:${completion}%"></span></div><button class="textbtn" style="padding-left:0;margin-top:7px" onclick="navigate('my-profile')">Finish profile →</button></div>`:''}<div class="columns"><div class="panel"><h2>Brand opportunities</h2><p>Brands with campaigns you may want to explore.</p>${brands.map(b=>`<div class="listrow"><div><strong>${esc(b.name)}</strong><p>${esc(b.category)} · ${esc(b.location||'Location not shared')}</p></div><button class="btn light sm" onclick="viewBrand('${b.id}')">View</button></div>`).join('')}<button class="textbtn" onclick="navigate('discover-brands')">Explore all brands →</button></div><div class="panel"><h2>Meet other creators</h2><p>Explore public work and learn how others present their experience.</p>${creators.map(c=>`<div class="listrow"><div style="display:flex;gap:9px;align-items:center"><div class="avatar">${initials(c.name)}</div><div><strong>${esc(c.name)}</strong><p>${esc(c.category)} · ★ ${c.rating||'New'}</p></div></div><button class="btn light sm" onclick="viewCreator('${c.id}')">View</button></div>`).join('')}<button class="textbtn" onclick="navigate('discover-creators')">Browse creators →</button></div></div>`}
function brandDashboard(){const p=currentProfile(),creators=rankedCreators().slice(0,3),connections=allConnections().filter(c=>c.brandKey===currentKey());return `${banner('BRAND WORKSPACE','Find the creator behind your next great campaign.','Search public portfolios, compare fit and reach out with a specific brief. Collably keeps the conversation and draft terms together.','Find creators',"navigate('find-creators')",'▦')}<div class="statgrid"><div class="statcard"><div class="statlabel">Creator matches</div><div class="statvalue">${allCreatorProfiles().length}</div><div class="statnote">Across categories and styles</div></div><div class="statcard"><div class="statlabel">Active connections</div><div class="statvalue">${connections.length}</div><div class="statnote">Invitations and conversations</div></div><div class="statcard"><div class="statlabel">Typical campaign budget</div><div class="statvalue">${money(p.budget||0)}</div><div class="statnote">Budget saved in your profile</div></div></div><div class="panel" style="margin-bottom:18px"><div class="sectionhead" style="margin:0 0 12px"><div><h2>Recommended creators</h2><p>Ranked using category, budget, experience and public review signals.</p></div><button class="btn light sm" onclick="navigate('find-creators')">View all</button></div><div class="catalog">${creators.map(c=>creatorCard(c,true)).join('')}</div></div><div class="columns"><div class="panel"><h2>Your company profile</h2><p>Make it easier for creators to assess whether they fit your brand.</p><div class="listrow"><div><strong>${esc(p.name)}</strong><p>${esc(p.category)} · ${esc(p.branch||'Branch not added')}</p></div><button class="btn light sm" onclick="navigate('brand-profile')">Edit</button></div><div class="listrow"><div><strong>Campaign goal</strong><p>${esc(p.goals||'Add a clear goal and ideal deliverables.')}</p></div></div></div><div class="panel"><h2>Next step</h2><p>Specific briefs lead to better conversations.</p><button class="btn full" onclick="navigate('campaigns')">＋ Create campaign brief</button><div class="notice green">Tip: include deliverables, usage rights, timeline and budget before negotiating.</div></div></div>`}
function rankedCreators(){const p=currentProfile();return allCreatorProfiles().map(c=>({...c,matchScore:calcMatch(p,c),matchWhy:matchReasons(p,c)})).sort((a,b)=>b.matchScore-a.matchScore)}function calcMatch(b,c){let s=40;if(b.category&&c.category===b.category)s+=28;else if((b.category||'').toLowerCase()===(c.category||'').toLowerCase())s+=20;const budget=Number(b.budget||0),rate=Number(c.budget??c.rate??0);if(budget&&rate){if(rate<=budget)s+=20;else s+=Math.max(0,10-Math.round((rate-budget)/Math.max(budget,1)*20))}if(Number(c.rating||0)>=4.7)s+=8;else if(Number(c.rating||0)>=4)s+=5;if(c.portfolio?.length)s+=4;return Math.min(99,Math.max(35,s))}function matchReasons(b,c){const r=[];if(b.category===c.category)r.push('category alignment');else r.push('adjacent creative category');const budget=Number(b.budget||0),rate=Number(c.budget??c.rate??0);if(budget&&rate&&rate<=budget)r.push('rate fits listed budget');if(Number(c.rating||0)>=4.5)r.push('strong public review signal');if(c.portfolio?.length)r.push('portfolio links available');return r.join(' · ')}
function discoverCreators(){return `${banner('CREATOR DISCOVERY','Find the right creator for the brief.','Search across public profiles. Compare relevant work, rates and review signals before sending a collaboration invite.','Create campaign brief',"navigate('campaigns')",'◎')}<div class="searchbar"><input class="searchinput" id="creatorSearch" value="${esc(searchFilters.q)}" placeholder="Search name, skill, experience or portfolio..." oninput="updateCreatorResults()"><select id="creatorCategory" onchange="updateCreatorResults()"><option>All categories</option>${categories.map(c=>`<option ${searchFilters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="creatorBudget" onchange="updateCreatorResults()"><option value="">Any budget</option><option value="10000" ${searchFilters.budget==='10000'?'selected':''}>Up to ₹10,000</option><option value="20000" ${searchFilters.budget==='20000'?'selected':''}>Up to ₹20,000</option><option value="30000" ${searchFilters.budget==='30000'?'selected':''}>Up to ₹30,000</option><option value="50000" ${searchFilters.budget==='50000'?'selected':''}>Up to ₹50,000</option></select><select id="creatorRating" onchange="updateCreatorResults()"><option value="0">Any rating</option><option value="4" ${searchFilters.rating==='4'?'selected':''}>4.0+ stars</option><option value="4.5" ${searchFilters.rating==='4.5'?'selected':''}>4.5+ stars</option></select><button class="btn light sm" onclick="resetCreatorFilters()">Reset</button></div><div class="resultsline"><span id="creatorCount"></span><span>Match score is illustrative in this prototype</span></div><div id="creatorResults" class="catalog"></div>`}
function updateCreatorResults(){const q=(document.getElementById('creatorSearch')?.value||'').toLowerCase();const cat=document.getElementById('creatorCategory')?.value||'All categories';const budget=Number(document.getElementById('creatorBudget')?.value||0);const rating=Number(document.getElementById('creatorRating')?.value||0);searchFilters={q,category:cat,budget:String(budget||''),rating:String(rating)};let arr=rankedCreators().filter(c=>!q||[c.name,c.headline,c.category,c.location,c.bio,c.work,...(c.skills||[]),...(c.portfolio||[]).map(x=>x.title+' '+x.description)].join(' ').toLowerCase().includes(q)).filter(c=>cat==='All categories'||c.category===cat).filter(c=>!budget||Number(c.budget??c.rate??0)<=budget).filter(c=>Number(c.rating||0)>=rating);const count=document.getElementById('creatorCount'),res=document.getElementById('creatorResults');if(count)count.textContent=`${arr.length} creator${arr.length===1?'':'s'} found`;if(res)res.innerHTML=arr.length?arr.map(c=>creatorCard(c,true)).join(''):'<div class="empty" style="grid-column:1/-1"><div class="empticon">⌕</div><strong>No exact matches</strong><p>Try another category, a wider budget or a different search.</p></div>'}
function resetCreatorFilters(){searchFilters={q:'',category:'All categories',budget:'',rating:'0'};discoverRouteRefresh()}
function creatorCard(c,showMatch=false){const score=showMatch?(c.matchScore||calcMatch(currentProfile(),c)):null;return `<article class="personcard"><div class="cover ${c.category==='Food'?'orange':c.category==='Travel'?'green':''}"></div><div class="personbody"><div class="personhead"><div class="avatar">${initials(c.name)}</div>${score?`<div class="score">${score}% match</div>`:''}</div><h3>${esc(c.name)}</h3><div class="personsub">${esc(c.headline||c.category+' creator')} · ${esc(c.location||'Location not added')}</div><p class="persondesc">${esc(c.bio||'Creator profile — details coming soon.').slice(0,165)}${(c.bio||'').length>165?'…':''}</p><div class="chips"><span class="chip">${esc(c.category||'Other')}</span>${(c.skills||[]).slice(0,2).map(s=>`<span class="chip gray">${esc(s)}</span>`).join('')}</div><div class="metarow"><span>★ ${c.rating?esc(c.rating):'New'} ${c.reviewsCount?`(${c.reviewsCount})`:''}</span><span>◉ ${esc(c.audience||'Audience n/a')}</span><span>↗ ${esc(c.engagement||0)}% engagement</span><strong>${money(c.budget??c.rate??0)}+</strong></div>${showMatch?`<div class="matchreason"><strong>Match notes</strong><br>${esc(c.matchWhy||matchReasons(currentProfile(),c))}<div class="small" style="margin-top:5px">Prototype ranking, not a production AI model.</div></div>`:''}<div class="cardactions"><button class="btn light sm" onclick="viewCreator('${esc(c.id)}')">View profile</button><button class="btn sm" onclick="connectToCreator('${esc(c.id)}')">Invite ↗</button></div></div></article>`}
function discoverBrands(){return `${banner('BRAND DISCOVERY','Find brands that fit your creative lane.','Browse company profiles, see campaign themes and connect with brands. You can also explore creator profiles to learn how others present their work.','Open my profile',"navigate('my-profile')",'▦')}<div class="searchbar"><input class="searchinput" id="brandSearch" placeholder="Search brand, product or campaign..." oninput="updateBrandResults()"><select id="brandCategory" onchange="updateBrandResults()"><option>All categories</option>${categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="btn light sm" onclick="document.getElementById('brandSearch').value='';document.getElementById('brandCategory').value='All categories';updateBrandResults()">Reset</button></div><div class="resultsline"><span id="brandCount"></span><span>Explore company profiles and public opportunities</span></div><div id="brandResults" class="catalog"></div><div class="sectionhead" style="margin-top:25px"><div><h2>Creators in the community</h2><p>Only public portfolio and review information is shown.</p></div><button class="btn light sm" onclick="navigate('discover-creators')">Explore creators</button></div><div class="catalog">${allCreatorProfiles().filter(c=>c.id!==currentKey()).slice(0,2).map(c=>creatorCard(c,false)).join('')}</div>`}
function updateBrandResults(){const q=(document.getElementById('brandSearch')?.value||'').toLowerCase(),cat=document.getElementById('brandCategory')?.value||'All categories';const arr=allBrandProfiles().filter(b=>(!q||[b.name,b.category,b.branch,b.location,b.description,b.campaign,b.goals].join(' ').toLowerCase().includes(q))&&(cat==='All categories'||b.category===cat));const count=document.getElementById('brandCount'),res=document.getElementById('brandResults');if(count)count.textContent=`${arr.length} brand${arr.length===1?'':'s'} found`;if(res)res.innerHTML=arr.length?arr.map(brandCard).join(''):'<div class="empty" style="grid-column:1/-1">No brands match those filters.</div>'}
function brandCard(b){const p=currentProfile(),same=b.category===p.category;return `<article class="personcard"><div class="cover green"></div><div class="personbody"><div class="personhead"><div class="avatar brandavatar">${initials(b.name)}</div><span class="score">${same?'Category fit':'Opportunity'}</span></div><h3>${esc(b.name)}</h3><div class="personsub">${esc(b.category)} · ${esc(b.branch||'Company')} · ${esc(b.location||'')}</div><p class="persondesc">${esc(b.description||'Company profile details coming soon.').slice(0,165)}</p><div class="chips">${(b.tags||[]).slice(0,3).map(t=>`<span class="chip green">${esc(t)}</span>`).join('')}</div><div class="metarow"><span>Campaign: ${esc(b.campaign||'Creator partnership')}</span><strong>${money(b.budget||0)} budget</strong></div><div class="cardactions"><button class="btn light sm" onclick="viewBrand('${esc(b.id)}')">View brand</button><button class="btn sm" onclick="connectToBrand('${esc(b.id)}')">Connect ↗</button></div></div></article>`}
function discoverRouteRefresh(){render();if(route==='find-creators'||route==='discover-creators')updateCreatorResults();if(route==='discover-brands')updateBrandResults()}
function afterRenderListings(){if(route==='find-creators'||route==='discover-creators')updateCreatorResults();if(route==='discover-brands')updateBrandResults()}
function myCreatorProfile(){const p=currentProfile(),c=profileCompletion();return `<div class="profilecompletion"><div style="display:flex;justify-content:space-between;gap:10px"><strong>Profile strength</strong><strong>${c}%</strong></div><div class="muted small">Your public profile helps brands review your work, experience and fit.</div><div class="completionbar"><span style="width:${c}%"></span></div><div style="margin-top:12px"><button class="btn light sm" onclick="navigate('discover-brands')">Discover brands</button></div></div><div class="profilepage"><div class="profilecover"></div><div class="profiledetail"><div class="profilehead"><div class="avatar">${initials(p.name)}</div><div class="profiletitle"><div><h1>${esc(p.name)}</h1><div class="muted">${esc(p.headline||p.category+' creator')} · ${esc(p.location||'')}</div></div><button class="btn light sm" onclick="editProfile()">✎ Edit profile</button></div></div><p class="profilebio">${esc(p.bio||'Add a bio that tells brands what you create and why it matters.')}</p><div class="chips"><span class="chip">${esc(p.category||'Category not added')}</span>${splitTags(p.skills).map(x=>`<span class="chip gray">${esc(x)}</span>`).join('')}</div><div class="profilestats"><div><strong>${money(p.budget||0)}+</strong><small>Starting rate</small></div><div><strong>${esc(p.experience||'—')}</strong><small>Experience</small></div><div><strong>${esc(p.audience||'—')}</strong><small>Audience</small></div><div><strong>${esc(p.engagement||0)}%</strong><small>Engagement</small></div></div></div></div><div class="detailgrid"><div class="panel"><h2>Portfolio & selected work</h2><p>Show work that is relevant to the collaborations you want.</p>${parsePortfolio(p.portfolio).length?parsePortfolio(p.portfolio).map((w,i)=>`<div class="workitem"><div class="workicon">${['▧','▶','✦'][i%3]}</div><div><strong>${esc(w.title)}</strong><div class="muted small">${esc(w.description)}</div>${w.url?`<a class="textbtn" style="display:inline-block;padding-left:0" href="${safeUrl(w.url)}" target="_blank" rel="noopener noreferrer">Open portfolio link ↗</a>`:''}</div></div>`).join(''):'<div class="empty">Add at least one portfolio item with a title, short description and link.</div>'}<div class="sectionhead" style="margin:12px 0 0"><button class="btn light sm" onclick="editProfile()">Add / edit work</button></div></div><div class="panel"><h2>Experience</h2><p>Professional background and collaboration details.</p><div class="listrow"><div><strong>${esc(p.experience||'Experience not added')}</strong><p>${esc(p.work||'Add past work, freelance experience or relevant projects.')}</p></div></div><h3 style="margin-top:17px">Reviews & testimonials</h3>${parseReviews(p.reviews).length?parseReviews(p.reviews).map(r=>`<div class="review"><div class="star">★★★★★</div><div>${esc(r)}</div><small class="muted">Creator-added testimonial</small></div>`).join(''):'<div class="empty" style="padding:18px">No testimonials added yet. Ask a previous client for genuine feedback.</div>'}<div class="notice">Reviews entered by the creator are displayed as testimonials; verified platform reviews would require a connected backend and completed transactions.</div></div></div>`}
function myBrandProfile(){const p=currentProfile();return `<div class="profilepage"><div class="profilecover" style="background:linear-gradient(120deg,#153c36,#28a981)"></div><div class="profiledetail"><div class="profilehead"><div class="avatar brandavatar">${initials(p.name)}</div><div class="profiletitle"><div><h1>${esc(p.name)}</h1><div class="muted">${esc(p.category)} · ${esc(p.branch)} · ${esc(p.location)}</div></div><button class="btn light sm" onclick="editProfile()">✎ Edit company</button></div></div><p class="profilebio">${esc(p.description||'Tell creators about your brand.')}</p><div class="chips"><span class="chip green">${esc(p.category)}</span><span class="chip gray">${esc(p.branch||'Business type')}</span></div><div class="profilestats"><div><strong>${money(p.budget||0)}</strong><small>Typical budget</small></div><div><strong>${esc(p.audience||'—')}</strong><small>Target audience</small></div><div><strong>${esc(p.location||'—')}</strong><small>Location</small></div></div><div class="detailgrid"><div class="panel"><h2>Campaign goals</h2><p>Give creators enough context to assess whether it fits their style.</p>${esc(p.goals||'No campaign goals added yet.')}</div><div class="panel"><h2>Company details</h2><div class="listrow"><div><strong>Website</strong><p>${p.website?`<a href="${safeUrl(p.website)}" target="_blank" rel="noopener noreferrer">${esc(p.website)}</a>`:'Not added'}</p></div></div><div class="listrow"><div><strong>Industry / category</strong><p>${esc(p.category)}</p></div></div><button class="btn full" onclick="navigate('campaigns')">Manage campaigns</button></div></div></div></div>`}
function safeUrl(s){try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function editProfile(){route=isCreator()?'my-profile':'brand-profile';const root=document.getElementById('modalRoot');const form=isCreator()?creatorProfileForm(currentProfile(),false):brandProfileForm(currentProfile(),false);root.innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><div class="eyebrow">Edit details</div><h2>${isCreator()?'Creator profile':'Company profile'}</h2></div><button class="iconbtn" onclick="closeModal()">×</button></div>${form}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function viewCreator(id){const c=allCreatorProfiles().find(x=>x.id===id);if(!c){toast('Creator profile not found.');return}showCreatorModal(c)}
function showCreatorModal(c){const same=currentKey()===c.userKey||currentKey()===c.id;const works=Array.isArray(c.portfolio)?c.portfolio:parsePortfolio(c.portfolio);const rating=c.rating||0;modal(`<div class="modalhead"><div><div class="eyebrow">Creator profile</div><h2>${esc(c.name)}</h2><div class="muted small">${esc(c.headline||c.category+' creator')} · ${esc(c.location||'')}</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><div class="profilehead" style="margin:10px 0 15px"><div class="avatar">${initials(c.name)}</div><div><strong>${esc(c.category)} · ${esc(c.experience||'Experience not added')}</strong><div class="muted small">${money(c.budget??c.rate??0)} starting rate · ★ ${rating||'New'} ${c.reviewsCount?`(${c.reviewsCount} reviews)`:''}</div></div></div><p>${esc(c.bio||'')}</p><div class="chips">${(c.skills||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div><div class="profilestats"><div><strong>${esc(c.audience||'—')}</strong><small>Audience</small></div><div><strong>${esc(c.engagement||0)}%</strong><small>Engagement</small></div><div><strong>${esc(c.experience||'—')}</strong><small>Experience</small></div></div><div class="detailgrid"><div class="panel"><h3>Portfolio</h3>${works.length?works.map(w=>`<div class="workitem"><div class="workicon">▶</div><div><strong>${esc(w.title||w)}</strong><div class="muted small">${esc(w.description||'Selected work')}</div>${w.url?`<a href="${safeUrl(w.url)}" target="_blank" rel="noopener noreferrer" class="textbtn" style="padding-left:0;display:inline-block">Open work ↗</a>`:''}</div></div>`).join(''):'<p class="muted">No portfolio links have been added.</p>'}${c.work?`<p>${esc(c.work)}</p>`:''}</div><div class="panel"><h3>Reviews & testimonials</h3>${(c.reviews||[]).length?(c.reviews||[]).map(r=>`<div class="review"><div class="reviewhead"><strong>${esc(r.by||'Testimonial')}</strong><span class="star">★★★★★</span></div><div>${esc(r.text||r)}</div></div>`).join(''):'<p class="muted">No reviews added yet.</p>'}<div class="matchreason"><strong>Fit signals</strong><br>${esc(matchReasons(currentProfile(),c))}<div class="small" style="margin-top:6px">Match scores are illustrative for this prototype.</div></div></div></div><div class="cardactions"><button class="btn light" onclick="closeModal()">Close</button>${isBrand()&&!same?`<button class="btn" onclick="closeModal();connectToCreator('${esc(c.id)}')">Invite to collaborate ↗</button>`:''}</div>`)}
function viewBrand(id){const b=allBrandProfiles().find(x=>x.id===id);if(!b){toast('Brand profile not found.');return}modal(`<div class="modalhead"><div><div class="eyebrow">Company profile</div><h2>${esc(b.name)}</h2><div class="muted small">${esc(b.category)} · ${esc(b.branch||'Company')} · ${esc(b.location||'')}</div></div><button class="iconbtn" onclick="closeModal()">×</button></div><p>${esc(b.description||'')}</p><div class="chips"><span class="chip green">${esc(b.category)}</span><span class="chip">${esc(b.branch||'Business type')}</span></div><div class="profilestats"><div><strong>${money(b.budget||0)}</strong><small>Campaign budget</small></div><div><strong>${esc(b.location||'—')}</strong><small>Location</small></div></div><div class="panel"><h3>Campaign opportunity</h3><strong>${esc(b.campaign||'Creator partnership')}</strong><p>${esc(b.goals||b.description||'Review the company profile before connecting.')}</p>${b.website?`<a href="${safeUrl(b.website)}" target="_blank" rel="noopener noreferrer" class="textbtn">Company website ↗</a>`:''}</div><div class="cardactions"><button class="btn light" onclick="closeModal()">Close</button>${isCreator()?`<button class="btn" onclick="closeModal();connectToBrand('${esc(b.id)}')">Connect with brand ↗</button>`:''}</div>`)}
function modal(inner){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${inner}</div></div>`}
function connectToCreator(id){if(!isBrand()){toast('Only a brand account can invite a creator.');return}const c=allCreatorProfiles().find(x=>x.id===id);if(!c)return;createConnection({brandKey:currentKey(),creatorKey:c.userKey||c.id,brandName:currentProfile().name,creatorName:c.name,category:c.category,budget:Number(currentProfile().budget||0),status:'Invitation sent',lastMessage:'Brand invited creator to discuss a collaboration.'});toast('Invitation created. Open Messages & negotiation to continue.');if(route==='find-creators'||route==='discover-creators')render()}
function connectToBrand(id){if(!isCreator()){toast('Only a creator account can connect with a brand.');return}const b=allBrandProfiles().find(x=>x.id===id);if(!b)return;createConnection({brandKey:b.userKey||b.id,creatorKey:currentKey(),brandName:b.name,creatorName:currentProfile().name,category:b.category,budget:Number(b.budget||currentProfile().budget||0),status:'Connection requested',lastMessage:'Creator requested a conversation about a collaboration.'});toast('Connection request created. Open Messages & negotiation to continue.');if(route==='discover-brands')render()}
function createConnection(data){const conns=allConnections();let ex=conns.find(c=>c.brandKey===data.brandKey&&c.creatorKey===data.creatorKey);if(ex){ex.status='Conversation started';ex.lastMessage=data.lastMessage;ex.updatedAt=new Date().toISOString()}else{ex={id:'connection-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),...data,messages:[{from:'system',text:data.lastMessage,at:new Date().toISOString()}],terms:{budget:Number(data.budget||0),deliverables:'To be agreed',deadline:'',usage:'To be agreed'},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};conns.unshift(ex)}write(STORE.connections,conns)}
function inboxPage(){const cs=allConnections().filter(c=>c.brandKey===currentKey()||c.creatorKey===currentKey());if(!cs.length)return `<div class="panel"><div class="empty"><div class="empticon">↗</div><h3>No conversations yet</h3><p>${isCreator()?'Connect with a brand to start a collaboration conversation.':'Invite a creator to discuss a campaign, scope and rates.'}</p><button class="btn" onclick="navigate('${isCreator()?'discover-brands':'find-creators'}')">${isCreator()?'Discover brands':'Discover creators'} →</button></div></div>`;return `${banner('PARTNERSHIP INBOX','Good collaborations start with clear conversations.','Discuss deliverables, timeline, budget and usage rights. Make sure both sides understand the scope before agreeing.','','','↗')}<div class="detailgrid"><div class="panel"><h2>Connections</h2><p>Select a conversation to continue negotiating.</p>${cs.map(c=>`<div class="listrow"><div><strong>${esc(isCreator()?c.brandName:c.creatorName)}</strong><p>${esc(c.category)} · ${esc(c.status)}</p><small class="muted">${esc(c.lastMessage||'No messages yet')}</small></div><button class="btn sm" onclick="openNegotiation('${esc(c.id)}')">Open</button></div>`).join('')}</div><div class="panel"><h2>Collaboration checklist</h2><div class="listrow"><div><strong>Deliverables</strong><p>Number and format of posts, videos or assets.</p></div></div><div class="listrow"><div><strong>Timeline</strong><p>Draft, revision and final delivery dates.</p></div></div><div class="listrow"><div><strong>Budget & payment</strong><p>Amount, schedule, and who pays which fees.</p></div></div><div class="listrow"><div><strong>Usage rights</strong><p>Where, how long and whether paid usage is included.</p></div></div></div></div>`}
function openNegotiation(id){activeConnectionId=id;route='inbox';render();const c=allConnections().find(x=>x.id===id);if(!c)return;const target=document.querySelector('.viewcontent');if(target)target.innerHTML=negotiationView(c)}
function negotiationView(c){const messages=c.messages||[];const terms=c.terms||{};return `<button class="backlink" onclick="navigate('inbox')">← All conversations</button><div class="detailgrid"><div class="panel chatpanel"><div class="modalhead"><div><div class="eyebrow">Collaboration conversation</div><h2>${esc(isCreator()?c.brandName:c.creatorName)}</h2><div class="muted small">${esc(c.category)} · ${esc(c.status)}</div></div><span class="chip">${esc(c.status)}</span></div><div class="chatlog" id="chatLog">${messages.map(m=>`<div class="messagebubble ${m.from===currentKey()?'mine':''}"><div>${esc(m.text)}</div><div class="small muted" style="margin-top:5px">${m.from==='system'?'Collably system':m.from===currentKey()?'You':esc(isCreator()?c.brandName:c.creatorName)} · ${new Date(m.at).toLocaleString()}</div></div>`).join('')}</div><form class="chatform" onsubmit="sendNegotiation(event,'${esc(c.id)}')"><input id="chatMessage" placeholder="Discuss deliverables, dates or budget…" required><button class="btn">Send</button></form><div class="small muted" style="margin-top:8px">Prototype conversation stored in this browser only.</div></div><div class="panel"><h2>Negotiation terms</h2><p>Use a shared proposal to make expectations explicit.</p><form onsubmit="saveTerms(event,'${esc(c.id)}')"><div class="formgrid"><div class="field full"><label>Proposed total budget (₹)</label><input name="budget" type="number" min="0" value="${esc(terms.budget||0)}" required></div><div class="field full"><label>Deliverables *</label><textarea name="deliverables" required placeholder="e.g. 2 reels + 3 stories">${esc(terms.deliverables==='To be agreed'?'':terms.deliverables||'')}</textarea></div><div class="field full"><label>Delivery deadline</label><input name="deadline" type="date" value="${esc(terms.deadline||'')}"></div><div class="field full"><label>Usage rights / payment terms</label><textarea name="usage" placeholder="Usage window, payment schedule, revisions...">${esc(terms.usage==='To be agreed'?'':terms.usage||'')}</textarea></div></div><button class="btn full" style="margin-top:14px">Save proposal</button></form><div class="notice">Saving a proposal records your current draft terms. It does not mean the other party accepted them.</div><button class="btn light full" style="margin-top:10px" onclick="suggestNegotiation('${esc(c.id)}')">✦ Suggest negotiation terms</button><button class="btn dark full" style="margin-top:9px" onclick="makeDeal('${esc(c.id)}')">Create deal summary →</button></div></div>`}
function sendNegotiation(e,id){e.preventDefault();const msg=document.getElementById('chatMessage')?.value.trim();if(!msg)return;const cs=allConnections(),c=cs.find(x=>x.id===id);if(!c)return;c.messages=c.messages||[];c.messages.push({from:currentKey(),text:msg,at:new Date().toISOString()});c.lastMessage=msg;c.updatedAt=new Date().toISOString();write(STORE.connections,cs);openNegotiation(id);}
function saveTerms(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const cs=allConnections(),c=cs.find(x=>x.id===id);if(!c)return;c.terms={...c.terms,...f,budget:Number(f.budget||0)};c.status='Proposal saved';c.messages=c.messages||[];c.messages.push({from:currentKey(),text:`Proposal updated: ${money(c.terms.budget)} for ${c.terms.deliverables}. Deadline: ${c.terms.deadline||'to be agreed'}.`,at:new Date().toISOString()});c.lastMessage='Proposal updated';write(STORE.connections,cs);toast('Proposal saved.');openNegotiation(id)}
function suggestNegotiation(id){const c=allConnections().find(x=>x.id===id);if(!c)return;const cr=allCreatorProfiles().find(x=>(x.userKey||x.id)===c.creatorKey),br=allBrandProfiles().find(x=>(x.userKey||x.id)===c.brandKey);const rate=Number(cr?.budget??cr?.rate??0),budget=Number(br?.budget||c.budget||0);let amount=rate||budget;if(rate&&budget){amount=rate<=budget?Math.round((rate+Math.min(budget,rate*1.1))/100)*100:Math.round((rate+budget)/200)*100;if(amount>budget)amount=budget}const defaults={Fashion:'1 short-form video, 3 story frames and 1 revision',Beauty:'1 product demo reel, 3 story frames and 1 revision',Travel:'1 destination reel, 5 edited photos and 1 revision',Food:'1 recipe / product reel, 3 story frames and 1 revision',Technology:'1 product explainer video, 3 story frames and 1 revision',Lifestyle:'1 lifestyle reel, 3 story frames and 1 revision'};const f=document.querySelector('.viewcontent form');if(!f)return;const b=f.querySelector('[name="budget"]'),d=f.querySelector('[name="deliverables"]'),u=f.querySelector('[name="usage"]');if(b)b.value=amount||0;if(d&&!d.value.trim())d.value=defaults[c.category]||'1 short-form video, 3 supporting story frames and 1 revision';if(u&&!u.value.trim())u.value='Confirm usage window, platform(s), revision limits and payment schedule in writing.';let box=f.querySelector('.suggestion');if(!box){box=document.createElement('div');box.className='suggestion';box.style.marginTop='12px';f.appendChild(box)}box.classList.remove('hidden');box.innerHTML='<strong>Suggested starting point</strong><br>Budget: '+esc(money(amount))+' · Deliverables: '+esc(d?.value||'To be agreed')+'<div class="small" style="margin-top:6px">Rule-based guidance from the saved profile rate, brand budget and category. Review and agree on terms together; this does not negotiate autonomously or contact the other party.</div>';toast('Suggested terms added for review.');}function makeDeal(id){const cs=allConnections(),c=cs.find(x=>x.id===id);if(!c)return;const existing=allDeals().find(d=>d.connectionId===id);if(existing){navigate('deals');return}if(!c.terms?.deliverables||c.terms.deliverables==='To be agreed'){toast('Add deliverables to the proposal before creating a deal.');return}const d={id:'deal-'+Date.now(),connectionId:id,creatorKey:c.creatorKey,brandKey:c.brandKey,creatorName:c.creatorName,brandName:c.brandName,category:c.category,budget:Number(c.terms.budget||0),deliverables:c.terms.deliverables,deadline:c.terms.deadline||'',usage:c.terms.usage||'',status:'Draft agreement',paymentStatus:'Not paid',createdAt:new Date().toISOString()};const deals=allDeals();deals.unshift(d);write(STORE.deals,deals);c.status='Deal draft created';write(STORE.connections,cs);toast('Deal summary created. Review it under Deals & receipts.');navigate('deals')}
function dealsPage(){const ds=allDeals().filter(d=>d.creatorKey===currentKey()||d.brandKey===currentKey());if(!ds.length)return `<div class="panel"><div class="empty"><div class="empticon">◇</div><h3>No deals yet</h3><p>Start a conversation, agree on deliverables and save a proposal to create a collaboration deal summary.</p><button class="btn" onclick="navigate('inbox')">Open messages →</button></div></div>`;return `${banner('DEALS & RECEIPTS','Make the scope clear before the work begins.','Review deal summaries, track the demonstration payment state and open a receipt after recording a simulated payment.','','','◇')}<div class="panel"><h2>Your collaboration deals</h2><p>These are draft summaries for clarity, not legally executed contracts.</p>${ds.map(d=>`<div class="listrow"><div><strong>${esc(isCreator()?d.brandName:d.creatorName)} · ${money(d.budget)}</strong><p>${esc(d.category)} · ${esc(d.status)} · ${esc(d.paymentStatus)}</p><small class="muted">${esc(d.deliverables)}</small></div><button class="btn sm" onclick="viewDeal('${esc(d.id)}')">Review deal</button></div>`).join('')}</div>`}
function viewDeal(id){const d=allDeals().find(x=>x.id===id);if(!d)return;const receipt=!!d.receipt;modal(`<div class="modalhead"><div><div class="eyebrow">Collaboration deal summary</div><h2>${esc(d.brandName)} × ${esc(d.creatorName)}</h2></div><button class="iconbtn" onclick="closeModal()">×</button></div><div class="agreementbox"><div class="receiptrow"><span>Category</span><strong>${esc(d.category)}</strong></div><div class="receiptrow"><span>Deliverables</span><strong style="max-width:65%;text-align:right">${esc(d.deliverables)}</strong></div><div class="receiptrow"><span>Delivery date</span><strong>${esc(d.deadline||'To be agreed')}</strong></div><div class="receiptrow"><span>Usage / payment terms</span><strong style="max-width:65%;text-align:right">${esc(d.usage||'To be agreed')}</strong></div><div class="receiptamount"><div class="muted small">Proposed total</div><strong>${money(d.budget)}</strong><div class="small muted">Deal status: ${esc(d.status)}</div></div><div class="notice amber">This is a prototype agreement summary, not legal advice or an executed contract.</div></div><div class="cardactions"><button class="btn light" onclick="closeModal()">Close</button>${receipt?`<button class="btn" onclick="closeModal();showReceipt('${esc(d.id)}')">View receipt →</button>`:`<button class="btn" onclick="simulatePayment('${esc(d.id)}')">Record simulated payment</button>`}</div>`)}
function simulatePayment(id){const ds=allDeals(),d=ds.find(x=>x.id===id);if(!d)return;if(!confirm('Record a DEMONSTRATION payment in this browser? No money will move and no bank or payment gateway is connected.'))return;d.paymentStatus='Paid (simulated)';d.status='Payment recorded (simulated)';d.receipt={number:'CLB-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6),at:new Date().toISOString(),amount:d.budget,method:'Demo payment record'};write(STORE.deals,ds);closeModal();showReceipt(id)}
function showReceipt(id){const d=allDeals().find(x=>x.id===id);if(!d)return;modal(`<div class="receipt"><div class="receiptlogo">collably.</div><div class="eyebrow" style="margin-top:22px">Transaction record · Prototype</div><h1 style="margin:6px 0">Payment receipt</h1><p class="muted">${d.receipt?'Payment recorded in this browser; no funds were transferred.':'No payment recorded.'}</p><div class="receiptamount"><div class="muted small">Demo amount</div><strong>${money(d.budget)}</strong><div class="small muted">${esc(d.paymentStatus)}</div></div><div class="receiptrow"><span>Receipt number</span><strong>${esc(d.receipt?.number||'Not generated')}</strong></div><div class="receiptrow"><span>Brand</span><strong>${esc(d.brandName)}</strong></div><div class="receiptrow"><span>Creator</span><strong>${esc(d.creatorName)}</strong></div><div class="receiptrow"><span>Deliverables</span><strong style="max-width:60%;text-align:right">${esc(d.deliverables)}</strong></div><div class="receiptrow"><span>Recorded at</span><strong>${d.receipt?new Date(d.receipt.at).toLocaleString():'—'}</strong></div><div class="notice amber">This is not a bank receipt or proof of an actual transaction. Payment gateway and settlement integration are not connected.</div><div class="cardactions"><button class="btn light" onclick="closeModal()">Close</button><button class="btn" onclick="window.print()">Print / Save receipt</button></div></div>`)}
function campaignsPage(){const cs=allCampaigns().filter(c=>c.brandKey===currentKey());return `<div class="panel" style="margin-bottom:17px"><div class="sectionhead" style="margin:0 0 12px"><div><h2>Campaign briefs</h2><p>Describe the work clearly before inviting creators.</p></div><button class="btn" onclick="newCampaign()">＋ New campaign</button></div>${cs.length?cs.map(c=>`<div class="listrow"><div><strong>${esc(c.name)}</strong><p>${esc(c.category)} · ${money(c.budget)} · ${esc(c.status)}</p><small class="muted">${esc(c.brief)}</small></div><button class="btn light sm" onclick="useCampaign('${esc(c.id)}')">View</button></div>`).join(''):'<div class="empty"><div class="empticon">▤</div><h3>No campaign briefs yet</h3><p>Create a brief with the goal, deliverables, timing and budget. You can then find suitable creators.</p><button class="btn" onclick="newCampaign()">Create your first brief</button></div>'}</div><div class="panel"><h2>What to include in a good brief</h2><div class="columns"><div><div class="listrow"><div><strong>Objective & audience</strong><p>What should the campaign achieve, and for whom?</p></div></div><div class="listrow"><div><strong>Deliverables & timeline</strong><p>Number of assets, format, deadlines and revision expectations.</p></div></div></div><div><div class="listrow"><div><strong>Budget & payment terms</strong><p>Set a realistic range and payment schedule.</p></div></div><div class="listrow"><div><strong>Content usage rights</strong><p>Clarify organic posting, paid ads and usage duration.</p></div></div></div></div></div>`}
function newCampaign(){modal(`<div class="modalhead"><div><div class="eyebrow">Campaign builder</div><h2>Create a campaign brief</h2></div><button class="iconbtn" onclick="closeModal()">×</button></div><form onsubmit="saveCampaign(event)"><div class="formgrid"><div class="field full"><label>Campaign name *</label><input name="name" required placeholder="e.g. New season launch"></div><div class="field"><label>Category *</label><select name="category">${categories.map(c=>`<option ${c===currentProfile().category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Campaign budget (₹)</label><input name="budget" type="number" min="0" value="${esc(currentProfile().budget||'')}" required></div><div class="field full"><label>Campaign brief *</label><textarea name="brief" required placeholder="Goal, target audience, creative direction and deliverables..."></textarea></div><div class="field"><label>Preferred deadline</label><input name="deadline" type="date"></div><div class="field"><label>Creator style</label><input name="style" placeholder="e.g. authentic UGC, cinematic, editorial"></div><div class="field full"><label>Content usage / requirements</label><textarea name="usage" placeholder="Platforms, usage period, paid ads, number of revisions..."></textarea></div></div><div class="cardactions"><button type="button" class="btn light" onclick="closeModal()">Cancel</button><button class="btn">Save campaign brief</button></div></form>`)}function saveCampaign(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),cs=allCampaigns();cs.unshift({id:'campaign-'+Date.now(),brandKey:currentKey(),...f,budget:Number(f.budget||0),status:'Draft',createdAt:new Date().toISOString()});write(STORE.campaigns,cs);closeModal();render();toast('Campaign brief saved in this browser.')}function useCampaign(id){const c=allCampaigns().find(x=>x.id===id);if(!c)return;modal(`<div class="modalhead"><div><div class="eyebrow">Campaign brief</div><h2>${esc(c.name)}</h2></div><button class="iconbtn" onclick="closeModal()">×</button></div><div class="agreementbox"><div class="receiptrow"><span>Category</span><strong>${esc(c.category)}</strong></div><div class="receiptrow"><span>Budget</span><strong>${money(c.budget)}</strong></div><div class="receiptrow"><span>Deadline</span><strong>${esc(c.deadline||'To be confirmed')}</strong></div><p>${esc(c.brief)}</p><p class="muted small">Creator style: ${esc(c.style||'Not specified')}<br>Usage: ${esc(c.usage||'Not specified')}</p></div><button class="btn full" onclick="closeModal();navigate('find-creators')">Find creators for this campaign →</button>`)}
function boot(){const s=read(STORE.session,null);if(s){const account=allUsers().find(x=>x.email===s.email&&x.role===s.role);if(account){user=account;route=account.profile?.setupComplete?'dashboard':(account.role==='creator'?'creator-setup':'brand-setup')}}render();if(route==='find-creators'||route==='discover-creators'||route==='discover-brands')afterRenderListings()}
// Re-render navigation views and hydrate interactive result lists after DOM insertion.
const _render=render;render=function(){_render();afterRenderListings()};
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2800)}
function printStyles(){return ''}
window.addEventListener('storage',()=>{if(user){const fresh=allUsers().find(x=>x.email===user.email);if(fresh)user=fresh;render()}});
boot();
</script>
</body></html>
